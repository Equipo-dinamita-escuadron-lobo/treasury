spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/treasury}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${DB_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: ${DB_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  flyway:
    enabled: ${DB_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${DB_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${DB_FLYWAY_BASELINE_VERSION:0}
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/auth/realms/oauth2-realm}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/auth/realms/oauth2-realm/protocol/openid-connect/certs}

server:
  port: ${PORT:0}

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.uuid}"
    hostname: ${INSTANCE_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

logging:
  level:
    org:
      Keycloak: ${KEYCLOAK_LOG_LEVEL:DEBUG}
jwt:
  auth:
    converter:
      principle-attribute: ${JWT_PRINCIPAL_ATTR:preferred_username}
      resource-id: ${JWT_RESOURCE_ID:microservices_client}

management:
  endpoint:
    health:
      probes:
        enabled: true

treasury:
  integrations:
    account-catalogue-url: ${ACCOUNT_CATALOGUE_URL:http://localhost:8080}
  security:
    service-token:
      uri: ${TREASURY_OAUTH_TOKEN_URI:${JWT_ISSUER_URI:http://localhost:8090/auth/realms/oauth2-realm}/protocol/openid-connect/token}
      client-id: ${TREASURY_OAUTH_CLIENT_ID:treasury-service}
      client-secret: ${TREASURY_OAUTH_CLIENT_SECRET:}
    rabbit:
      expected-audience: ${TREASURY_RABBIT_AUDIENCE:treasury}
      facture-azp: ${TREASURY_RABBIT_FACTURE_AZP:facture-service}
      accounting-azp: ${TREASURY_RABBIT_ACCOUNTING_AZP:account-catalogue-service}
  scheduler:
    payment-delay-ms: ${TREASURY_PAYMENT_SCHEDULER_DELAY_MS:60000}
    outbox-delay-ms: ${TREASURY_OUTBOX_DELAY_MS:5000}
    timezone: ${TREASURY_TIMEZONE:America/Bogota}
