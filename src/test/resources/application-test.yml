spring:
  datasource:
    url: jdbc:h2:mem:treasury;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test
          jwk-set-uri: http://localhost/test/certs
eureka:
  client:
    enabled: false
jwt:
  auth:
    converter:
      principle-attribute: preferred_username
      resource-id: microservices_client
treasury:
  scheduler:
    payment-delay-ms: 3600000
